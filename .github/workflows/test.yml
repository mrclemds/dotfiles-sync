name: Test

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"

permissions:
  contents: read

jobs:
  updater:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck

      - name: Validate shell syntax
        run: sh -n bin/dotfiles-sync tests/test_dotfiles_sync.sh

      - name: Lint shell scripts
        run: shellcheck bin/dotfiles-sync tests/test_dotfiles_sync.sh

      - name: Run updater tests
        run: sh tests/test_dotfiles_sync.sh

  workflows:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Lint workflows
        run: |
          gopath=$(go env GOPATH)
          export PATH="$gopath/bin:$PATH"
          actionlint
