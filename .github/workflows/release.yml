name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to create, such as v1.0.0 or v1.2.3 (must start with v)
        required: true
        type: string
      release_maintenance_branch:
        description: Create or update the matching maintenance branch
        required: false
        default: false
        type: boolean

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      TAG: ${{ inputs.tag }}
    outputs:
      maintenance_branch: ${{ steps.release_source.outputs.branch }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require successful test workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          successful_runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow Test --commit "$GITHUB_SHA" \
            --json status,conclusion --jq '[.[] | select(.status == "completed" and .conclusion == "success")] | length')
          if [ "$successful_runs" -eq 0 ]; then
            printf 'No successful Test workflow exists for %s\n' "$GITHUB_SHA" >&2
            exit 1
          fi

      - name: Validate release source
        id: release_source
        run: |
          set -eu
          case "$TAG" in
            v*) ;;
            *)
              printf 'Release tag must start with v: %s\n' "$TAG" >&2
              exit 1
              ;;
          esac
          . .github/scripts/release-version.sh
          version=$(release_version "$TAG") || {
            printf 'Unsupported release tag: %s\n' "$TAG" >&2
            exit 1
          }
          if [ "${{ inputs.release_maintenance_branch }}" != true ] && [ "$GITHUB_REF_NAME" != main ]; then
            printf 'Release %s without maintenance branch management must run from main, not %s\n' \
              "$TAG" "$GITHUB_REF_NAME" >&2
            exit 1
          fi
          branch=
          if [ "${{ inputs.release_maintenance_branch }}" = true ]; then
            branch=$(release_maintenance_branch "$TAG")
          fi
          printf 'branch=%s\n' "$branch" >> "$GITHUB_OUTPUT"

      - name: Create release tag
        run: |
          set -eu
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git fetch --quiet origin "refs/tags/$TAG:refs/tags/$TAG"
            if [ "$(git rev-parse "$TAG^{}")" != "$GITHUB_SHA" ]; then
              printf 'Release tag %s does not point to %s\n' "$TAG" "$GITHUB_SHA" >&2
              exit 1
            fi
            printf 'Reusing release tag: %s\n' "$TAG"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi

      - name: Create maintenance branch
        if: ${{ inputs.release_maintenance_branch }}
        env:
          BRANCH: ${{ steps.release_source.outputs.branch }}
        run: |
          set -eu
          if git ls-remote --exit-code --heads origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
            git fetch --quiet origin "$BRANCH"
            if ! git merge-base --is-ancestor "origin/$BRANCH" "$GITHUB_SHA"; then
              printf 'Release %s is not a fast-forward update to %s\n' "$TAG" "$BRANCH" >&2
              exit 1
            fi
            git push origin "$GITHUB_SHA:refs/heads/$BRANCH"
            printf 'Updated maintenance branch: %s\n' "$BRANCH"
          else
            git fetch --quiet origin main
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              printf 'New maintenance branch source must be reachable from main\n' >&2
              exit 1
            fi
            git push origin "$GITHUB_SHA:refs/heads/$BRANCH"
            printf 'Created maintenance branch: %s\n' "$BRANCH"
          fi

      - name: Select latest release
        id: release_version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          . .github/scripts/release-version.sh
          current_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
          case "$current_tag" in
            ''|"$TAG") latest=true ;;
            *)
              if release_version "$current_tag" >/dev/null && release_version_is_greater "$TAG" "$current_tag"; then
                latest=true
              else
                latest=false
              fi
              ;;
          esac
          printf 'latest=%s\n' "$latest" >> "$GITHUB_OUTPUT"

      - name: Build release archive
        run: |
          set -eu
          rm -rf dist/package
          mkdir -p dist/package
          git archive --format=tar --prefix="dotfiles-sync/" "$GITHUB_SHA" -- \
            .release-url \
            LICENSE \
            README.md \
            bin/dotfiles-sync \
            bin/install-dotfiles-sync \
            .config/dotfiles-sync/config.example \
            .config/dotfiles-sync/ignore.example \
            .config/dotfiles-sync/migrations \
            systemd/dotfiles-sync.service \
            systemd/dotfiles-sync.timer | tar -xf - -C dist/package
          printf '%s\n' "$TAG" > dist/package/dotfiles-sync/.release-version
          tar -C dist/package -czf dist/dotfiles-sync.tgz dotfiles-sync
          tar -tzf dist/dotfiles-sync.tgz >/dev/null
          cp dist/package/dotfiles-sync/bin/install-dotfiles-sync dist/install-dotfiles-sync.sh
          sh -n dist/install-dotfiles-sync.sh

      - name: Create release changelog
        run: |
          set -eu
          previous_tag=$(git describe --tags --abbrev=0 "$GITHUB_SHA^" 2>/dev/null || true)
          {
            printf '# %s\n\n' "$TAG"
            printf '## Changes\n\n'
            if [ -n "$previous_tag" ]; then
              git log --format='- %s (%h)' "$previous_tag..$GITHUB_SHA"
            else
              git log --format='- %s (%h)' "$GITHUB_SHA"
            fi
          } > dist/release-notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.release_version.outputs.latest }}
        run: |
          if [ "$LATEST" = true ]; then
            gh release create "$TAG" "dist/dotfiles-sync.tgz" "dist/install-dotfiles-sync.sh" --title "$TAG" --notes-file dist/release-notes.md --latest
          else
            gh release create "$TAG" "dist/dotfiles-sync.tgz" "dist/install-dotfiles-sync.sh" --title "$TAG" --notes-file dist/release-notes.md --latest=false
          fi

  cleanup-migrations:
    needs: release
    if: ${{ inputs.release_maintenance_branch }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      TAG: ${{ inputs.tag }}
      BRANCH: ${{ needs.release.outputs.maintenance_branch }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create migration cleanup pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          for target in main "$BRANCH"; do
            git fetch --quiet origin "$target"
            cleanup_branch="automation/cleanup-migrations-${TAG#v}-${target#release/}"
            git switch --create "$cleanup_branch" "origin/$target"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git ls-files '.config/dotfiles-sync/migrations/v*.sh' | sort -V > migrations
            count=$(wc -l < migrations)
            [ "$count" -gt 2 ] || continue
            sed -n "1,$((count - 2))p" migrations > expired-migrations
            while IFS= read -r migration; do
              git rm -- "$migration"
            done < expired-migrations
            git commit -m "chore: retire old migrations"
            git push origin "$cleanup_branch"
            gh pr create --base "$target" --head "$cleanup_branch" \
              --title "chore: retire old migrations" \
              --body "Retains the two newest runtime migration scripts after $TAG."
          done
