name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Create maintenance branch
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version=${TAG#v}
          case "$version" in
            ''|.*|*..*|*.|*[!0-9.]*)
              printf 'Unsupported release tag: %s\n' "$TAG" >&2
              exit 1
              ;;
          esac
          case "$version" in
            *.*.*.*)
              printf 'Unsupported release tag: %s\n' "$TAG" >&2
              exit 1
              ;;
            *.*)
              major=${version%%.*}
              minor_and_patch=${version#*.}
              minor=${minor_and_patch%%.*}
              minor_branch="release/v${major}.${minor}"
              major_branch="release/v${major}"
              if git ls-remote --exit-code --heads origin "refs/heads/$minor_branch" >/dev/null 2>&1; then
                branch=$minor_branch
              elif git ls-remote --exit-code --heads origin "refs/heads/$major_branch" >/dev/null 2>&1; then
                branch=$major_branch
              else
                printf 'No maintenance branch exists for %s; create %s on demand\n' "$TAG" "$minor_branch" >&2
                exit 1
              fi
              ;;
            *) branch="release/v${version}" ;;
          esac
          if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
            case "$version" in
              *.*)
                git fetch --quiet origin "$branch"
                if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$branch"; then
                  printf 'Minor and patch tag %s must be created from %s\n' "$TAG" "$branch" >&2
                  exit 1
                fi
                ;;
            esac
            printf 'Maintenance branch already exists: %s\n' "$branch"
          else
            base_branch=
            if git ls-remote --exit-code --heads origin refs/heads/main >/dev/null 2>&1; then
              git fetch --quiet origin main
              if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
                base_branch=main
              fi
            fi
            if [ -z "$base_branch" ]; then
              printf 'Initial release tag %s must be created from main\n' "$TAG" >&2
              exit 1
            fi
            git push origin "$GITHUB_SHA:refs/heads/$branch"
            printf 'Created maintenance branch: %s\n' "$branch"
          fi

      - name: Select latest release
        id: release_version
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version_parts() {
            value=${1#v}
            major=${value%%.*}
            remainder=${value#*.}
            if [ "$remainder" = "$value" ]; then
              printf '%s 0 0\n' "$major"
              return
            fi
            minor=${remainder%%.*}
            patch=${remainder#*.}
            if [ "$patch" = "$remainder" ]; then
              patch=0
            fi
            printf '%s %s %s\n' "$major" "$minor" "$patch"
          }
          version_is_greater() {
            candidate=$1
            current=$2
            # shellcheck disable=SC2046
            set -- $(version_parts "$candidate")
            candidate_major=$1 candidate_minor=$2 candidate_patch=$3
            # shellcheck disable=SC2046
            set -- $(version_parts "$current")
            current_major=$1 current_minor=$2 current_patch=$3
            [ "$candidate_major" -gt "$current_major" ] && return 0
            [ "$candidate_major" -lt "$current_major" ] && return 1
            [ "$candidate_minor" -gt "$current_minor" ] && return 0
            [ "$candidate_minor" -lt "$current_minor" ] && return 1
            [ "$candidate_patch" -gt "$current_patch" ]
          }
          current_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
          case "$current_tag" in
            ''|"$TAG") latest=true ;;
            *)
              case "${current_tag#v}" in
                ''|.*|*..*|*.|*.*.*.*|*[!0-9.]*) latest=false ;;
                *)
                  if version_is_greater "$TAG" "$current_tag"; then
                    latest=true
                  else
                    latest=false
                  fi
                  ;;
              esac
              ;;
          esac
          printf 'latest=%s\n' "$latest" >> "$GITHUB_OUTPUT"

      - name: Build release archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          rm -rf dist/package
          mkdir -p dist/package
          git archive --format=tar --prefix="dotfiles-sync/" "$GITHUB_SHA" -- \
            .release-url \
            README.md \
            bin/dotfiles-sync \
            .config/dotfiles-sync/config.example \
            .config/dotfiles-sync/ignore.example \
            .config/dotfiles-sync/migrations \
            systemd/dotfiles-sync.service \
            systemd/dotfiles-sync.timer | tar -xf - -C dist/package
          printf '%s\n' "$TAG" > dist/package/dotfiles-sync/.release-version
          tar -C dist/package -czf dist/dotfiles-sync.tgz dotfiles-sync
          tar -tzf dist/dotfiles-sync.tgz >/dev/null

      - name: Create release changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          previous_tag=$(git describe --tags --abbrev=0 "$GITHUB_SHA^" 2>/dev/null || true)
          {
            printf '# %s\n\n' "$TAG"
            printf '## Changes\n\n'
            if [ -n "$previous_tag" ]; then
              git log --format='- %s (%h)' "$previous_tag..$GITHUB_SHA"
            else
              git log --format='- %s (%h)' "$GITHUB_SHA"
            fi
          } > dist/release-notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          LATEST: ${{ steps.release_version.outputs.latest }}
        run: |
          if [ "$LATEST" = true ]; then
            gh release create "$TAG" "dist/dotfiles-sync.tgz" --title "$TAG" --notes-file dist/release-notes.md --latest
          else
            gh release create "$TAG" "dist/dotfiles-sync.tgz" --title "$TAG" --notes-file dist/release-notes.md --latest=false
          fi

  cleanup-migrations:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Create migration cleanup pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version=${TAG#v}
          case "$version" in
            *.*) major=${version%%.*}; remainder=${version#*.}; branch="release/v${major}.${remainder%%.*}" ;;
            *) branch="release/v${version}" ;;
          esac
          for target in main "$branch"; do
            git fetch --quiet origin "$target"
            cleanup_branch="automation/cleanup-migrations-${TAG#v}-${target#release/}"
            git switch --create "$cleanup_branch" "origin/$target"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git ls-files '.config/dotfiles-sync/migrations/v*.sh' | sort -V > migrations
            count=$(wc -l < migrations)
            [ "$count" -gt 2 ] || continue
            sed -n "1,$((count - 2))p" migrations > expired-migrations
            while IFS= read -r migration; do
              git rm -- "$migration"
            done < expired-migrations
            git commit -m "chore: retire old migrations"
            git push origin "$cleanup_branch"
            gh pr create --base "$target" --head "$cleanup_branch" \
              --title "chore: retire old migrations" \
              --body "Retains the two newest runtime migration scripts after $TAG."
          done
